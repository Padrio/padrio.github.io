name: PR Build Check

on:
  # Läuft bei jedem Pull Request gegen main, bevor gemerged (und damit deployt) wird
  pull_request:
    branches: [ main ]

# Der Check liest nur den Code, er deployt nichts
permissions:
  contents: read

# Pro PR läuft nur der jeweils neueste Check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job-Key = Name des Status-Kontexts. Bewusst nicht "build", weil deploy.yml
  # denselben Key nutzt und dieser Name von der Branch-Protection eingefroren wird.
  pr-build:
    runs-on: ubuntu-latest
    # Der Build dauert ~25 s; ohne Angabe gilt das Default von 360 Minuten
    timeout-minutes: 10
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Set up Node.js
        # Node 22 — identisch zur Version in deploy.yml
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Dieses Repo hat keinen Linter. Eine Klasse, die unter Tailwind 4 nur noch
      # semantisch falsch ist, baut grün durch — genau so ist die shadow-sm-Regression
      # aus PRI-68 live gegangen. Dieser Schritt ist das Gate dagegen; er läuft vor
      # `npm ci`, damit ein Verstoß in Sekunden auffällt und keine Installation kostet.
      - name: Reject Tailwind-3 idioms in src/
        run: |
          set -uo pipefail

          test -d src || { echo "src/ nicht gefunden — läuft dieser Schritt im Repo-Root?"; exit 1; }

          # Token-Grenzen nach der in PRI-80 festgelegten Matching-Semantik:
          # links Zeilenanfang, Whitespace, Anführungszeichen, Backtick oder ":"
          # (damit "hover:shadow-sm", "md:shadow-sm", "group-hover:shadow-sm" treffen),
          # rechts Zeilenende, Whitespace, Anführungszeichen oder Backtick.
          # Folgt daraus und ist so gewollt: "drop-shadow-sm" löst das Muster
          # "shadow-sm" NICHT aus — links davon steht ein "-", keine Tokengrenze.
          # Es hat seinen eigenen Eintrag in der Liste.
          LB="(^|[[:space:]\"\`':])"
          RB="([[:space:]\"\`']|\$)"

          findings=""
          checked=0

          # $1 = Muster, wie es im Log erscheint · $2 = ERE · $3 = die richtige Ersetzung
          # $4 = optional: eine Datei, die für genau dieses Muster übersprungen wird
          scan() {
            local label="$1" re="$2" fix="$3" skip="${4:-}" loc
            checked=$((checked + 1))
            while IFS= read -r loc; do
              [ -n "$loc" ] || continue
              if [ -n "$skip" ] && [ "${loc%%:*}" = "$skip" ]; then continue; fi
              findings="${findings}  ${loc}  ${label}  ->  ${fix}"$'\n'
            done < <(grep -rnE -- "$re" src/ | cut -d: -f1,2)
          }

          # ganzes Klassen-Token bzw. Präfix; ein optionales $3 wird als Skip durchgereicht
          token()  { local p="$1" f="$2"; shift 2; scan "$p" "${LB}${p}${RB}" "$f" "$@"; }
          prefix() { local p="$1" f="$2"; shift 2; scan "$p" "${LB}${p}" "$f" "$@"; }

          # ---------------------------------------------------------------------------
          # Die Liste. Sie steht bewusst hier und nicht in einer eigenen Datei: Muster
          # und Matching-Semantik gehören zusammen, und eine Listenänderung soll nach
          # der Review-Matrix den Security & Ops Auditor ziehen (CEO-Entscheidung,
          # PRI-80, 2026-10-01).
          #
          # | Muster                  | Warum unter TW4 falsch                                        | Richtig                  |
          # |-------------------------|---------------------------------------------------------------|--------------------------|
          # | shadow-sm               | TW3-Skala um eine Stufe verschoben: TW4 shadow-sm ist der alte | shadow-xs                |
          # |                         | shadow (10 %, zwei Ebenen statt 5 %, einer)                   |                          |
          # | rounded-sm              | dieselbe Verschiebung                                         | rounded-xs               |
          # | blur-sm                 | dieselbe Verschiebung                                         | blur-xs                  |
          # | drop-shadow-sm          | dieselbe Verschiebung                                         | drop-shadow-xs           |
          # | theme(                  | mit @config emittiert TW4 --font-* nicht; theme('fontFamily.  | CSS-Variable direkt      |
          # |                         | mono') wird zu var(--font-mono) und damit zu totem Code       |                          |
          # | *-opacity-              | in TW4 entfernt, erzeugt stillschweigend kein CSS             | Slash-Syntax,            |
          # |                         |                                                               | z. B. bg-stone-900/50    |
          # | flex-shrink- / -grow-   | in TW4 umbenannt                                              | shrink- / grow-          |
          # | overflow-ellipsis       | in TW4 entfernt                                               | text-ellipsis            |
          # | decoration-slice/-clone | in TW4 entfernt                                               | box-decoration-*         |
          # | ring (nacktes Token)    | TW4 setzt die Default-Ringbreite von 3 px auf 1 px            | ring-3, oder bewusst     |
          # |                         |                                                               | ring-1                   |
          # | outline-none            | existiert weiter, bedeutet aber anderes: TW3 = outline: 2px   | outline-hidden           |
          # |                         | solid transparent (Fokus bleibt im Forced-Colors-Modus        |                          |
          # |                         | sichtbar), TW4 = outline-style: none. Still weggefallener     |                          |
          # |                         | Fokusring.                                                    |                          |
          #
          # Bewusst NICHT auf der Liste — bitte nicht "ergänzen":
          #   - nacktes `shadow`: gegen das ausgelieferte CSS auf pkrason.de geprüft,
          #     TW4 emittiert es unverändert zu TW3. Außerdem wäre Hero.astro mit
          #     `hover:shadow` ein sofortiger Fehlalarm.
          #   - `transition-[…transform…]`: echte TW4-Falle, aber die korrekte Regel
          #     lautet "enthält transform, aber nicht translate" — eine andere
          #     Regelklasse als eine Mustersuche. Eigenes Issue, falls gewünscht.
          # ---------------------------------------------------------------------------

          token  "shadow-sm"             "shadow-xs"
          token  "rounded-sm"            "rounded-xs"
          token  "blur-sm"               "blur-xs"
          token  "drop-shadow-sm"        "drop-shadow-xs"

          # literale Zeichenkette, kein Klassen-Token — "(" in der ERE maskiert
          scan   "theme("                "theme\("                 "CSS-Variable direkt, z. B. var(--color-…)"

          prefix "bg-opacity-"           "Slash-Syntax, z. B. bg-stone-900/50"
          prefix "text-opacity-"         "Slash-Syntax, z. B. text-stone-900/50"
          prefix "border-opacity-"       "Slash-Syntax, z. B. border-stone-900/50"
          prefix "ring-opacity-"         "Slash-Syntax, z. B. ring-stone-900/50"
          prefix "divide-opacity-"       "Slash-Syntax, z. B. divide-stone-900/50"
          prefix "placeholder-opacity-"  "Slash-Syntax, z. B. placeholder-stone-900/50"

          prefix "flex-shrink-"          "shrink-"
          prefix "flex-grow-"            "grow-"

          token  "overflow-ellipsis"     "text-ellipsis"
          token  "decoration-slice"      "box-decoration-slice"
          token  "decoration-clone"      "box-decoration-clone"
          # Scope-Einschränkung mit konkretem Fund (PRI-80 erlaubt sie genau dafür):
          # `ring` ist auch ein gewöhnliches englisches Wort, und src/styles/global.css:30
          # enthält im Prosa-Kommentar über dem Fokus-Ring "…leave no focus ring at all,".
          # Das ist der einzige Treffer in src/ und ein echter Fehlalarm. Der Preis dieser
          # Ausnahme, bewusst in Kauf genommen und hier benannt: ein nacktes `ring` in einer
          # @apply-Liste in genau dieser Datei würde das Gate nicht mehr sehen — die drei
          # @apply-Zeilen dort (:21, :47, :51) enthalten heute keins. Alle anderen Muster
          # prüfen global.css weiterhin vollständig.
          token  "ring"                  "ring-3 für die alte Optik, oder bewusst ring-1"  "src/styles/global.css"
          token  "outline-none"          "outline-hidden"

          if [ -n "$findings" ]; then
            echo "Tailwind-3-Idiome in src/ gefunden — dieser PR wird abgelehnt."
            echo ""
            printf '%s' "$findings"
            echo ""
            echo "Links die Fundstelle, dann das getroffene Muster, dann die richtige Ersetzung."
            echo "Warum dieses Gate existiert und warum einzelne Kandidaten bewusst nicht auf der"
            echo "Liste stehen: Issue PRI-80, Begründung auch als Kommentar in dieser Datei direkt"
            echo "über der Liste (.github/workflows/pr-build.yml)."
            exit 1
          fi

          echo "Keine Tailwind-3-Idiome in src/ gefunden ($checked Muster geprüft)."

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

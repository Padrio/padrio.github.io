name: PR Build Check

on:
  # Läuft bei jedem Pull Request gegen main, bevor gemerged (und damit deployt) wird
  pull_request:
    branches: [ main ]

# Der Check liest nur den Code, er deployt nichts
permissions:
  contents: read

# Pro PR läuft nur der jeweils neueste Check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job-Key = Name des Status-Kontexts. Bewusst nicht "build", weil deploy.yml
  # denselben Key nutzt und dieser Name von der Branch-Protection eingefroren wird.
  pr-build:
    runs-on: ubuntu-latest
    # Der Build dauert ~25 s; ohne Angabe gilt das Default von 360 Minuten
    timeout-minutes: 10
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Set up Node.js
        # Node 22 — identisch zur Version in deploy.yml
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Dieses Repo hat keinen Linter. Eine Klasse, die unter Tailwind 4 nur noch
      # semantisch falsch ist, baut grün durch — genau so ist die shadow-sm-Regression
      # aus PRI-68 live gegangen. Dieser Schritt ist das Gate dagegen; er läuft vor
      # `npm ci`, damit ein Verstoß in Sekunden auffällt und keine Installation kostet.
      - name: Reject Tailwind-3 idioms in src/
        run: |
          set -uo pipefail

          test -d src || { echo "src/ nicht gefunden — läuft dieser Schritt im Repo-Root?"; exit 1; }

          # Ein ":" im Dateinamen macht die Meldung "datei:zeile" mehrdeutig und würde
          # den Dateivergleich der Skip-Ausnahme unten falsch zerlegen. Ein Zeilenumbruch
          # im Dateinamen tut dasselbe von der anderen Seite: er zerlegt einen grep-Record
          # in zwei und erzeugt aus einem echten Fund zwei Phantom-Fundstellen
          # ("src/we:src/we" plus "ird.css:1"). Beides ist fail-closed — der Step geht
          # trotzdem auf exit 1 —, aber die gemeldete Fundstelle schickt den Leser an die
          # falsche Stelle (PRI-87 Finding 2, PRI-92 F-C). Heute hat kein Pfad im Repo
          # eines von beidem; käme einer dazu, bricht das Gate lieber ab, als eine
          # Fundstelle falsch zu melden.
          # Auch hier gilt: ein Fehler ist kein "nichts gefunden". Ohne diese Abfrage
          # würde errexit den Step kommentarlos töten (fail-closed, aber ohne Grund
          # im Log), etwa bei einem unlesbaren Verzeichnis unter src/.
          # Die ANSI-C-Quotung $'*\n*' ist nötig; "*$(printf '\n')*" funktioniert NICHT —
          # die Kommandosubstitution frisst den Zeilenumbruch, das Muster kollabiert zu
          # "**" und träfe jede Datei.
          # -printf '[%p]' statt des nackten Pfads: im Zeilenumbruch-Fall ist die
          # Meldung selbst zweizeilig, und ohne Klammern ist nicht ansehbar, ob ein
          # Pfad oder zwei gefunden wurden (PRI-96 Finding 4).
          odd_paths=$(find src \( -name '*:*' -o -name $'*\n*' \) -printf '  [%p]\n') && find_rc=0 || find_rc=$?
          if [ "$find_rc" -ne 0 ]; then
            echo "find brach unter src/ mit Status ${find_rc} ab (Details auf stderr). Das Gate"
            echo "kann nicht bestätigen, dass src/ vollständig lesbar ist, und lehnt deshalb ab."
            exit 1
          fi
          if [ -n "$odd_paths" ]; then
            echo "Pfade mit \":\" oder Zeilenumbruch unter src/ gefunden — das Gate kann"
            echo "\"datei:zeile\" nicht eindeutig melden und lehnt deshalb ab (ein Eintrag je"
            echo "Klammerpaar):"
            printf '%s\n' "$odd_paths"
            exit 1
          fi

          # Token-Grenzen nach der in PRI-80 festgelegten Matching-Semantik:
          # links Zeilenanfang, Whitespace, Anführungszeichen, Backtick oder ":"
          # (damit "hover:shadow-sm", "md:shadow-sm", "group-hover:shadow-sm" treffen),
          # rechts Zeilenende, Whitespace, Anführungszeichen, Backtick oder ";".
          # Folgt daraus und ist so gewollt: "drop-shadow-sm" löst das Muster
          # "shadow-sm" NICHT aus — links davon steht ein "-", keine Tokengrenze.
          # Es hat seinen eigenen Eintrag in der Liste.
          #
          # Das ";" rechts ist mit PRI-80 nachgetragen (Finding beider Auditoren auf
          # PRI-87/PRI-88): hinter der letzten Klasse einer @apply-Deklaration steht
          # immer ein ";", und ohne diese Grenze war genau sie ungeprüft — in allen
          # 19 @apply-Zeilen in src/ (legal.astro, privacy.astro, global.css).
          # "@apply rounded-lg shadow-sm;" baute damit still grün durch.
          LB="(^|[[:space:]\"\`':])"
          RB="([[:space:]\"\`';]|\$)"

          findings=""
          checked=0
          checked_records=""

          # $1 = Muster, wie es im Log erscheint · $2 = ERE · $3 = die richtige Ersetzung
          # $4 = optional: GENAU EINE Datei, die für dieses Muster übersprungen wird.
          # Mehr als vier Argumente sind ein Fehlaufruf und werden laut abgelehnt, statt
          # still verworfen zu werden (PRI-99 F-3/F-4): "${4:-}" bindet ein Skip, ein
          # fünftes Argument hätte sonst keine Wirkung und niemand würde es merken.
          #
          # Ein fehlgeschlagener Scan darf nicht als "nichts gefunden" durchgehen — das
          # wäre genau das stille Grün, gegen das dieses Gate gebaut ist. grep liefert
          # 0 = Treffer, 1 = kein Treffer, >= 2 = Fehler; ab 2 bricht der Step hart ab.
          # Der Status wird dafür in dieser Shell ausgewertet und nicht in einer
          # Prozess-Substitution verworfen, deren Ergebnis die Shell nie ansieht.
          # "-a" behandelt Binärdateien als Text, statt sie still zu überspringen:
          # GNU grep meldet "binary file matches" auf stderr und erzeugt keinen Fund.
          scan() {
            local label="$1" re="$2" fix="$3" skip="${4:-}" out rc rec file lineno
            # Hier wird arithmetisch verglichen, und das ist die einzige Stelle, an der
            # das noch zulässig ist: "$#" ist ein von der Shell erzeugter Spezialparameter,
            # immer eine nichtnegative Dezimalzahl und nach oben durch ARG_MAX begrenzt.
            # "test ... -gt" kann hier also nicht mit Status 2 abbrechen, und ein Status 2
            # wäre in einer if-Bedingung stillschweigend "falsch" (errexit greift dort
            # nicht). Eine von Hand gepflegte ZAHL gibt es in diesem Schritt seit dem
            # Manifest (PRI-107) nicht mehr: die Musterliste wird als Zeichenkette
            # verglichen, nicht als Anzahl.
            if [ "$#" -gt 4 ]; then
              echo "scan(): $# Argumente für das Muster \"${label}\" — gebunden werden nur vier."
              echo "Ein zweites Skip-Argument hat keine Wirkung; dafür müsste scan() erweitert"
              echo "werden. Das Gate lehnt ab, statt den Aufruf still halb auszuführen."
              exit 1
            fi
            # Der Datensatz, den das Manifest unten vergleicht: die vollständige
            # Argumentliste dieses Aufrufs außer der ERE, als "Muster|Ersetzung|Skip".
            # Das Skip MUSS mit hinein (PRI-105 S-1): ein nachträglich angehängtes
            # viertes Argument nimmt einem Muster lautlos die Deckung in genau einer
            # Datei — praktisch in der Datei, in die man die Regression schreiben will —,
            # und an der ANZAHL der Aufrufe ist davon nichts zu sehen. Die ERE bleibt
            # bewusst draußen; welche Lücke das offen lässt, steht unten am Manifest.
            #
            # Enthielte ein Argument selbst ein "|" oder einen Zeilenumbruch, wären zwei
            # verschiedene Argumentlisten als Datensatz nicht mehr unterscheidbar bzw.
            # ein Datensatz nicht mehr genau eine Zeile — der Vergleich wäre dort blind.
            # Heute hat kein Argument eines von beidem; käme eines dazu, lehnt das Gate
            # ab, statt die Deckung still zu verlieren.
            case "${label}${fix}${skip}" in
              *'|'*|*$'\n'*)
                echo "Argument mit \"|\" oder Zeilenumbruch beim Muster \"${label}\" — das"
                echo "Manifest unten trennt seine Felder mit \"|\" und hält je Aufruf genau eine"
                echo "Zeile. Das Gate lehnt ab, statt einen nicht eindeutigen Datensatz zu"
                echo "vergleichen."
                exit 1
                ;;
            esac
            checked=$((checked + 1))
            checked_records="${checked_records}${label}|${fix}|${skip}"$'\n'
            out=$(grep -rnaE -- "$re" src/) && rc=0 || rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "grep brach beim Muster \"${label}\" mit Status ${rc} ab. Das Gate kann nicht"
              echo "bestätigen, dass src/ geprüft wurde, und lehnt deshalb ab."
              exit 1
            fi
            [ -n "$out" ] || return 0
            while IFS= read -r rec; do
              [ -n "$rec" ] || continue
              file=${rec%%:*}
              lineno=${rec#*:}
              lineno=${lineno%%:*}
              if [ -n "$skip" ] && [ "$file" = "$skip" ]; then continue; fi
              findings="${findings}  ${file}:${lineno}  ${label}  ->  ${fix}"$'\n'
            done <<< "$out"
          }

          # ganzes Klassen-Token bzw. Präfix; ein optionales $3 wird als Skip durchgereicht
          token()  { local p="$1" f="$2"; shift 2; scan "$p" "${LB}${p}${RB}" "$f" "$@"; }
          prefix() { local p="$1" f="$2"; shift 2; scan "$p" "${LB}${p}" "$f" "$@"; }

          # ---------------------------------------------------------------------------
          # Die Liste. Sie steht bewusst hier und nicht in einer eigenen Datei: Muster
          # und Matching-Semantik gehören zusammen, und eine Listenänderung soll nach
          # der Review-Matrix den Security & Ops Auditor ziehen (CEO-Entscheidung,
          # PRI-80, 2026-10-01).
          #
          # | Muster                  | Warum unter TW4 falsch                                        | Richtig                  |
          # |-------------------------|---------------------------------------------------------------|--------------------------|
          # | shadow-sm               | TW3-Skala um eine Stufe verschoben: TW4 shadow-sm ist der alte | shadow-xs                |
          # |                         | shadow (10 %, zwei Ebenen statt 5 %, einer)                   |                          |
          # | rounded-sm              | dieselbe Verschiebung                                         | rounded-xs               |
          # | blur-sm                 | dieselbe Verschiebung                                         | blur-xs                  |
          # | drop-shadow-sm          | dieselbe Verschiebung                                         | drop-shadow-xs           |
          # | theme(                  | unter @config KEIN totes var(), sondern ein Literal — siehe   | CSS-Variable direkt      |
          # |                         | (c) unter der Tabelle. Steht als Konventionsregel auf der     |                          |
          # |                         | Liste, nicht als CSS-Defekt                                   |                          |
          # | *-opacity-              | in TW4 entfernt, erzeugt stillschweigend kein CSS             | Slash-Syntax,            |
          # |                         |                                                               | z. B. bg-stone-900/50    |
          # | flex-shrink- /          | in TW4 umbenannt; die alte Schreibweise emittiert weiter      | shrink- / grow-          |
          # | flex-grow-              | dieselbe Deklaration — deprecated, nicht still gebrochen (b)  |                          |
          # | flex-shrink /           | dieselben zwei Utilities nackt, ohne Zahl; ebenfalls dieselbe | shrink / grow            |
          # | flex-grow               | Deklaration wie shrink/grow (b)                               |                          |
          # | overflow-ellipsis       | seit TW3.0 deprecated zugunsten von text-ellipsis. NICHT      | text-ellipsis            |
          # |                         | entfernt: emittiert gegen 4.3.3 gemessen weiter               |                          |
          # | decoration-slice/-clone | dito, zugunsten von box-decoration-*                          | box-decoration-*         |
          # | ring (nacktes Token)    | TW4 setzt die Default-Ringbreite von 3 px auf 1 px            | ring-3, oder bewusst     |
          # |                         |                                                               | ring-1                   |
          # | outline-none            | existiert weiter, bedeutet aber anderes: TW3 = outline: 2px   | outline-hidden           |
          # |                         | solid transparent (Fokus bleibt im Forced-Colors-Modus        |                          |
          # |                         | sichtbar), TW4 = outline-style: none. Still weggefallener     |                          |
          # |                         | Fokusring.                                                    |                          |
          #
          # Die Liste enthält drei Klassen von Einträgen, und der Unterschied ist wichtig
          # für jeden, der hier hereinläuft:
          #   (a) STILL GEBROCHEN — die Klasse erzeugt unter TW4 kein CSS oder anderes
          #       CSS als unter TW3: shadow-sm/rounded-sm/blur-sm/drop-shadow-sm
          #       (verschobene Skala), *-opacity-* (entfernt, kein CSS), ring (1 px statt
          #       3 px), outline-none (outline-style: none).
          #   (b) DEPRECATED, ABER FUNKTIONIEREND — die alte Schreibweise emittiert weiter
          #       dieselbe Deklaration wie die neue: flex-grow/flex-shrink in beiden
          #       Formen, overflow-ellipsis, decoration-slice/-clone.
          #   (c) KEIN CSS-DEFEKT, sondern Konventions- und Buildfrage: theme(. Unter
          #       @config löst es zu einem LITERAL auf, ist also NICHT totes var()
          #       (gemessen am gebauten dist/-CSS dieses Projekts, PRI-112 F-1:
          #         theme('fontFamily.mono')    ->  JetBrains Mono,ui-monospace,monospace
          #         theme('colors.orange.600')  ->  oklch(64.6% .222 41.116)
          #         theme('borderRadius.lg')    ->  .5rem).
          #       Außerhalb von global.css ist es umgekehrt ein HARTER Buildfehler: in
          #       einem Astro-Scoped-<style> ohne @config im Scope bricht npm run build
          #       mit "Could not resolve value for theme function" und exit 1 ab. In
          #       keinem der beiden Kontexte ist theme( also still — in global.css
          #       funktioniert es, außerhalb scheitert es laut und wird schon vom zweiten
          #       Gate gefangen. Auf dieser Liste steht es, damit die CSS-Variable die
          #       eine Schreibweise im Repo bleibt.
          # Gemessen am 2026-10-01 gegen das installierte tailwindcss 4.3.3, zweimal
          # unabhängig: über compile() aus dem Paket und am gebauten dist/-CSS dieses
          # Projekts (also mit dem @config-Legacy-Modus aus global.css). Je identische
          # Deklaration für alte und neue Schreibweise:
          #     .flex-grow{flex-grow:1}                  .grow{flex-grow:1}
          #     .flex-shrink,.shrink{flex-shrink:1}      (vom Minifier zusammengelegt)
          #     .overflow-ellipsis{text-overflow:ellipsis}
          #     .decoration-slice{-webkit-box-decoration-break:slice;box-decoration-break:slice}
          # Gegenkontrolle, damit die Messung nicht selbst fail-open ist: .bg-opacity-50
          # kommt in beiden Messungen NICHT vor — die *-opacity-*-Familie ist wirklich
          # weg, und ein frei erfundenes grow-bogus-xyz emittiert ebenfalls nichts.
          # Die (b)-Einträge bleiben trotzdem auf der Liste: sie halten die Schreibweise
          # im Repo einheitlich auf TW4. Dass die Liste sie enthält, ist eine
          # Board-Entscheidung (PRI-80); wer sie für ein merge-blockierendes Gate zu
          # streng findet, ändert das über das Board und nicht hier.
          #
          # Bewusst NICHT auf der Liste — bitte nicht "ergänzen":
          #   - nacktes `shadow`: gegen das ausgelieferte CSS auf pkrason.de geprüft,
          #     TW4 emittiert es unverändert zu TW3. Außerdem wäre Hero.astro mit
          #     `hover:shadow` ein sofortiger Fehlalarm.
          #   - `transition-[…transform…]`: echte TW4-Falle, aber die korrekte Regel
          #     lautet "enthält transform, aber nicht translate" — eine andere
          #     Regelklasse als eine Mustersuche. Eigenes Issue, falls gewünscht.
          # ---------------------------------------------------------------------------

          token  "shadow-sm"             "shadow-xs"
          token  "rounded-sm"            "rounded-xs"
          token  "blur-sm"               "blur-xs"
          token  "drop-shadow-sm"        "drop-shadow-xs"

          # literale Zeichenkette, kein Klassen-Token — "(" in der ERE maskiert.
          # Bewusst für JEDES theme(), nicht nur für theme('fontFamily.…'): eine
          # Farbabfrage wie theme('colors.orange.600') löst unter @config zwar auf,
          # aber die Unterscheidung gehört nicht in eine Mustersuche. Wer hier
          # hereinläuft, schreibt die CSS-Variable hin — kein Fehlalarm.
          scan   "theme("                "theme\("                 "CSS-Variable direkt, z. B. var(--color-…)"

          prefix "bg-opacity-"           "Slash-Syntax, z. B. bg-stone-900/50"
          prefix "text-opacity-"         "Slash-Syntax, z. B. text-stone-900/50"
          prefix "border-opacity-"       "Slash-Syntax, z. B. border-stone-900/50"
          prefix "ring-opacity-"         "Slash-Syntax, z. B. ring-stone-900/50"
          prefix "divide-opacity-"       "Slash-Syntax, z. B. divide-stone-900/50"
          prefix "placeholder-opacity-"  "Slash-Syntax, z. B. placeholder-stone-900/50"

          prefix "flex-shrink-"          "shrink-"
          prefix "flex-grow-"            "grow-"

          # Dieselben zwei Utilities nackt, ohne Zahl. Die Präfix-Muster darüber
          # verlangen den Bindestrich, deshalb rutschte class="flex-grow" an ihnen vorbei
          # (Vorschlag des Code Auditors auf PRI-87, Board-Entscheidung vom 2026-10-01:
          # "als zwei Token-Muster aufnehmen").
          # Überschneidungsfrei zu den Präfix-Mustern, gemessen: "flex-grow-0" hat rechts
          # von "flex-grow" keine Tokengrenze und löst deshalb nur das Präfix-Muster aus;
          # "flex-grow" hat keinen Bindestrich und löst nur dieses hier aus. Je genau ein
          # Fund, nie zwei. Die Datensätze unterscheiden sich ("flex-grow|grow|" gegen
          # "flex-grow-|grow-|"), das Manifest unten verlangt deshalb beide Zeilen und
          # hält keine davon für eine Dopplung der anderen.
          # Fehlalarm-Fläche, gemessen (PRI-113 S-1): beide Muster schlagen auch an, wenn
          # flex-grow/flex-shrink als CSS-WERT stehen — "transition: flex-grow 0.2s;" und
          # "will-change: flex-shrink;" treffen, und die gemeldete Ersetzung ist dort
          # falsch, weil "grow" keine CSS-Property ist. Der häufigste Fall bleibt korrekt
          # still: "flex-grow: 1;" trifft NICHT, weil ":" keine rechte Tokengrenze ist.
          # Das ist fail-closed, also kein stilles Grün — aber dies ist der Pflicht-Check
          # ohne Bypass-Actors, und bis zur Umformulierung kann niemand mergen. Der
          # Notausgang unten bei `ring` gilt wörtlich auch für diese zwei Muster.
          token  "flex-shrink"           "shrink"
          token  "flex-grow"             "grow"

          token  "overflow-ellipsis"     "text-ellipsis"
          token  "decoration-slice"      "box-decoration-slice"
          token  "decoration-clone"      "box-decoration-clone"
          # Scope-Einschränkung mit konkretem Fund (PRI-80 erlaubt sie genau dafür):
          # `ring` ist auch ein gewöhnliches englisches Wort, und src/styles/global.css:30
          # enthält im Prosa-Kommentar über dem Fokus-Ring "…leave no focus ring at all,".
          # Das ist der einzige Treffer in src/ und ein echter Fehlalarm. Der Preis dieser
          # Ausnahme, bewusst in Kauf genommen und hier benannt: ein nacktes `ring` in einer
          # @apply-Liste in genau dieser Datei würde das Gate nicht mehr sehen — die drei
          # @apply-Zeilen dort (:21, :47, :51) enthalten heute keins. Alle anderen Muster
          # prüfen global.css weiterhin vollständig.
          #
          # Notausgang, falls ein Muster auf Prosa oder auf legitimes CSS anschlägt. Zwei
          # Stellen, an denen damit zu rechnen ist: `ring` als englisches Alltagswort, etwa
          # in einer Projektbeschreibung unter src/content/projects/, und flex-grow/
          # flex-shrink in der CSS-Wert-Position (gemessen, siehe oben bei den zwei
          # Token-Zeilen). Für alle gilt derselbe Weg: PRI-80
          # erlaubt die Scope-Einschränkung ausdrücklich, aber nur mit einem Kommentar
          # hier, der den konkreten Fund nennt. Der kürzeste Weg ist, die Prosa
          # umzuformulieren — NICHT das Muster entfernen und nicht den Skip auf ein
          # ganzes Verzeichnis verbreitern.
          # Achtung (PRI-99 F-3): eine ZWEITE Skip-Datei geht nicht nebenbei. scan()
          # bindet genau ein Skip ("${4:-}"); ein fünftes Argument lehnt scan() jetzt
          # laut ab, und die token-Zeile zu duplizieren hilft auch nicht: jede Kopie
          # bindet nur ihr eigenes Skip, also meldet jede Kopie genau den Fund, den die
          # andere überspringt — rot, aber mit der Fundstellen-Meldung und ohne jeden
          # Hinweis darauf, dass das Konstrukt nicht funktioniert hat. Eine VERBATIM
          # duplizierte Zeile ist ebenfalls rot, aber über einen anderen Guard: solange
          # irgendeine ungeskippte Prosa-Stelle offen ist, über die Fundstellen-Meldung,
          # sonst über den Manifest-Vergleich unten — die Kopie läuft als zusätzliche
          # Vielfachheit mit und steht so nicht im Manifest (in PRI-107 für die verbatim
          # duplizierte Zeile nachgemessen). Alle sechs Varianten sind in PRI-80 Runde 6
          # gegen die damalige Zahlenprüfung gemessen, nicht gegen das Manifest.
          # Zwei Skip-Dateien brauchen also zuerst eine Erweiterung von scan()
          # auf eine Liste — das ist eine Änderung an der Gate-Mechanik und zieht nach
          # der Review-Matrix den Security & Ops Auditor.
          # Ein solcher Workflow-PR kommt an seinem eigenen Gate vorbei, solange die
          # auslösende Prosa nicht in seinem Branch liegt; das Gate kann sich also
          # nicht selbst aussperren.
          token  "ring"                  "ring-3 für die alte Optik, oder bewusst ring-1"  "src/styles/global.css"
          token  "outline-none"          "outline-hidden"

          # ---------------------------------------------------------------------------
          # DAS MANIFEST: dieselben Aufrufe wie oben als Literal, je Zeile
          # "Muster|Ersetzung|Skip-Datei" (leeres drittes Feld = kein Skip). Es steht
          # bewusst direkt unter der Liste und nicht oben bei checked=0: wer eine Zeile
          # der Liste anfasst, sieht das Manifest im selben Diff-Hunk. Verglichen wird es
          # weiter unten, auf dem grünen Pfad — ein echter Fund soll zuerst im Log stehen
          # und nicht von dieser Meldung verdeckt werden.
          #
          # WAS ES FÄNGT: die gelaufene Aufrufliste gegen dieses Literal, beide Seiten
          # sortiert und mit Vielfachheit, als Zeichenkette. Das ist EINE Prüfung für
          # sechs Fehlerbilder, für die es vorher zwei brauchte — und drei davon gingen
          # durch beide hindurch:
          #   - Zeile entfernt    (vorher rot über die Zahlenprüfung)
          #   - Zeile ergänzt     (vorher rot über die Zahlenprüfung)
          #   - Zeile gedoppelt   (vorher rot über den Doppel-Check)
          #   - Zeile UMBENANNT   (vorher STILL GRÜN: blur-sm -> blur-md ließ checked bei
          #                        20 und alle Labels eindeutig, das verdrängte Muster
          #                        war ungeprüft)
          #   - Label VERTIPPT    (vorher STILL GRÜN: shadow-smm, dito)
          #   - Skip angehängt oder umgebogen (vorher STILL GRÜN, PRI-105 S-1: ein
          #                        viertes Argument ist die legitime Aufrufform und
          #                        ändert weder Anzahl noch Eindeutigkeit)
          # Bei token/prefix kann das Muster nicht vom Label abweichen — beide leiten
          # sich aus demselben "$1" ab —, ein vertipptes Label ist dort also immer auch
          # ein vertipptes Muster und wird hier gefangen.
          #
          # WAS ES NICHT FÄNGT, bewusst in Kauf genommen (CEO-Entscheidung PRI-106):
          # einen Vertipper ALLEIN IN DER ERE der einzigen echten scan-Zeile
          # (scan "theme(" "theme\(" …). Nur dort sind Muster und ERE zwei getrennte
          # Argumente und können auseinanderlaufen. Die ERE steht bewusst nicht im
          # Datensatz: bei den 19 token/prefix-Zeilen schleppte sie die LB/RB-Konstanten
          # mit, und jede Änderung an der Matching-Semantik müsste dann 19 Manifestzeilen
          # anfassen. Ein Hash über die Datensätze (die verworfene Variante B) hätte
          # dieselbe Lücke gehabt und könnte zusätzlich nicht sagen, WELCHE Zeile falsch
          # ist.
          #
          # DER PREIS: die Liste steht jetzt zweimal in dieser Datei. Eine bewusste
          # Listenänderung ist an BEIDEN Stellen nachzuziehen. Ein vergessener Nachzug
          # ist rot, nicht still grün — das ist die Richtung, in der dieser Fehler
          # passieren darf. Kein Padding und keine Leerzeichen zur Ausrichtung:
          # verglichen werden Bytes.
          # ---------------------------------------------------------------------------
          pattern_manifest=(
            'shadow-sm|shadow-xs|'
            'rounded-sm|rounded-xs|'
            'blur-sm|blur-xs|'
            'drop-shadow-sm|drop-shadow-xs|'
            'theme(|CSS-Variable direkt, z. B. var(--color-…)|'
            'bg-opacity-|Slash-Syntax, z. B. bg-stone-900/50|'
            'text-opacity-|Slash-Syntax, z. B. text-stone-900/50|'
            'border-opacity-|Slash-Syntax, z. B. border-stone-900/50|'
            'ring-opacity-|Slash-Syntax, z. B. ring-stone-900/50|'
            'divide-opacity-|Slash-Syntax, z. B. divide-stone-900/50|'
            'placeholder-opacity-|Slash-Syntax, z. B. placeholder-stone-900/50|'
            'flex-shrink-|shrink-|'
            'flex-grow-|grow-|'
            'flex-shrink|shrink|'
            'flex-grow|grow|'
            'overflow-ellipsis|text-ellipsis|'
            'decoration-slice|box-decoration-slice|'
            'decoration-clone|box-decoration-clone|'
            'ring|ring-3 für die alte Optik, oder bewusst ring-1|src/styles/global.css'
            'outline-none|outline-hidden|'
          )

          if [ -n "$findings" ]; then
            echo "Tailwind-3-Idiome in src/ gefunden — dieser PR wird abgelehnt."
            echo ""
            printf '%s' "$findings"
            echo ""
            echo "Links die Fundstelle, dann das getroffene Muster, dann die richtige Ersetzung."
            echo "Warum dieses Gate existiert und warum einzelne Kandidaten bewusst nicht auf der"
            echo "Liste stehen: Issue PRI-80, Begründung auch als Kommentar in dieser Datei direkt"
            echo "über der Liste (.github/workflows/pr-build.yml)."
            exit 1
          fi

          # Ohne diese Prüfung wird die Musterliste nur AUSGEFÜHRT und nie nachgewiesen.
          # Fällt eine token/prefix/scan-Zeile weg (Tippfehler, verunglückter Merge,
          # Rebase-Konflikt in diesem Block), meldete das Gate zufrieden "19 Muster
          # geprüft" und ginge grün. Niemand liest 19 gegen 20, solange nichts danach
          # fragt. Das ist dieselbe Fehlerklasse, gegen die dieses Gate gebaut ist: eine
          # plausible Erfolgsmeldung über einem nicht erfolgten Scan (PRI-92 F-A).
          #
          # Verglichen wird als ZEICHENKETTE — beide Seiten durch "sort | uniq -c", dann
          # "!=". Kein arithmetischer Vergleich und keine von Hand gepflegte Zahl mehr.
          # Damit ist die test-Status-2-Klasse hier strukturell erledigt und nicht nur
          # abgedeckt: "test -ne" bricht bei einem Nicht-Integer UND bei einer reinen
          # Ziffernfolge über INTMAX_MAX mit Status 2 ab, und in der Bedingung eines "if"
          # gilt Status 2 schlicht als "falsch" — die Prüfung entfiel dann lautlos
          # (PRI-96 F-1, PRI-97 F-1, PRI-99 F-1, PRI-100 S-1). An dieser Konstruktion
          # gibt es nichts mehr, das so abbrechen könnte. Auch die Status-Abfragen unten
          # vergleichen Zeichenketten ("!=" gegen 0) bzw. gehen über "case": "$?" ist
          # immer eine kleine Dezimalzahl, der Stringvergleich ist hier gleichbedeutend
          # und kann selbst nicht mit Status 2 enden.
          #
          # Die Vielfachheit ("uniq -c", nicht "uniq") muss mit in den Vergleich: eine
          # zusätzlich eingefügte KOPIE einer Listenzeile wäre als reine Mengendifferenz
          # unsichtbar. Dass beide Seiten durch dasselbe sort/uniq laufen, macht den
          # Vergleich unabhängig von Sortierreihenfolge, Locale und Zählerformatierung —
          # eine Abweichung dort trifft beide Seiten gleich.
          ran=$(printf '%s' "$checked_records" | sort | uniq -c) && ran_rc=0 || ran_rc=$?
          if [ "$ran_rc" != 0 ]; then
            echo "Die gelaufene Musterliste ließ sich nicht sortieren und zählen (Status"
            echo "${ran_rc}, Details auf stderr). Das Gate kann sie nicht gegen das Manifest"
            echo "in dieser Datei prüfen und lehnt deshalb ab, statt unter dem errexit des"
            echo "Runners ohne Meldung zu enden."
            exit 1
          fi
          want=$(printf '%s\n' "${pattern_manifest[@]}" | sort | uniq -c) && want_rc=0 || want_rc=$?
          if [ "$want_rc" != 0 ]; then
            echo "Das Manifest in dieser Datei ließ sich nicht sortieren und zählen (Status"
            echo "${want_rc}, Details auf stderr). Das Gate kann die gelaufene Musterliste"
            echo "nicht dagegen prüfen und lehnt deshalb ab."
            exit 1
          fi

          # Mengendifferenz über die gezählten Zeilen, damit die Meldung sagt, WELCHE
          # Zeilen auseinanderlaufen, und nicht nur, dass sie es tun. Die leere Seite
          # muss vor grep abgefangen werden: "grep -vxF -- ''" ist ein Muster auf die
          # LEERE Zeile und nicht "kein Muster" — ohne die ersten zwei Zeilen meldete
          # eine komplett leere gelaufene Liste eine Differenz von einer Leerzeile.
          only_in() {
            if [ -z "$1" ]; then return 0; fi
            if [ -z "$2" ]; then printf '%s\n' "$1"; return 0; fi
            printf '%s\n' "$1" | grep -vxF -- "$2"
          }

          if [ "$ran" != "$want" ]; then
            echo "Die gelaufene Musterliste stimmt nicht mit dem Manifest in dieser Datei"
            echo "überein — mindestens ein Muster ist damit ungeprüft, während das Gate sonst"
            echo "\"nichts gefunden\" gemeldet hätte."
            diff_broken=no
            only_ran=$(only_in "$ran" "$want") && ran_only_rc=0 || ran_only_rc=$?
            only_want=$(only_in "$want" "$ran") && want_only_rc=0 || want_only_rc=$?
            # grep: 0 = Zeilen ausgegeben, 1 = keine, >= 2 Fehler.
            case $ran_only_rc in 0|1) ;; *) diff_broken=yes ;; esac
            case $want_only_rc in 0|1) ;; *) diff_broken=yes ;; esac
            if [ "$diff_broken" = no ] && { [ -n "$only_ran" ] || [ -n "$only_want" ]; }; then
              if [ -n "$only_ran" ]; then
                echo ""
                echo "nur gelaufen, nicht im Manifest — ergänzt, umbenannt, vertippt, gedoppelt"
                echo "oder mit einem Skip versehen:"
                printf '%s\n' "$only_ran"
              fi
              if [ -n "$only_want" ]; then
                echo ""
                echo "nur im Manifest, nicht gelaufen — entfernt, umbenannt oder von einer Kopie"
                echo "verdrängt:"
                printf '%s\n' "$only_want"
              fi
            else
              # Entweder hat grep selbst versagt, oder beide Differenzen sind leer,
              # obwohl die Listen sich unterscheiden (nach Konstruktion unmöglich,
              # deshalb hier mit Status und beiden Listen statt mit einer Behauptung).
              echo ""
              echo "Welche Zeilen auseinanderlaufen, ließ sich nicht bestimmen (grep-Status"
              echo "${ran_only_rc} bzw. ${want_only_rc}). Deshalb beide Listen vollständig:"
              echo ""
              echo "gelaufen:"
              printf '%s\n' "$ran"
              echo ""
              echo "Manifest:"
              printf '%s\n' "$want"
            fi
            echo ""
            echo "Je Zeile: Vielfachheit, dann Muster|Ersetzung|Skip-Datei. Eine bewusste"
            echo "Listenänderung ist im Manifest direkt unter der Liste nachzuziehen (und"
            echo "zieht nach der Review-Matrix in CLAUDE.md den Security & Ops Auditor)."
            exit 1
          fi

          # $checked ist keine eigene Prüfung mehr, nur noch die Zahl im Log — und an
          # dieser Stelle beweisbar richtig: scan() zählt $checked in derselben Zeile
          # hoch, in der es den Datensatz anhängt, die Zahl ist also immer die
          # Zeilenzahl von $checked_records, und die stimmt hier gerade Zeile für Zeile
          # mit dem Manifest überein.
          echo "Keine Tailwind-3-Idiome in src/ gefunden ($checked Muster geprüft, Liste gegen das Manifest abgeglichen)."

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
